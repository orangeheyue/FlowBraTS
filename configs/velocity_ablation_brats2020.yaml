_base_: configs/finetune_brats2020.yaml
seed: 1037
device: cuda:0
model:
  velocity_type: residual
train:
  epochs: 40
  batch_size: 1
  grad_accumulation: 4
  workers: 2
  output: outputs/velocity_ablation/residual
validation:
  every: 10
  patience: 0
  auto_test: true
  selection: Five fixed representative masks; WT/TC/ET mean Dice primary, HD95 tie-break
  masks:
  - flairt1cet1t2
  - t1cet1t2
  - flairt1t2
  - flair
  - t1c
